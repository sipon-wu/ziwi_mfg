    unit: 件
    source_tables: [inventory]
    module: 仓储管理(M20)
    caliber: 指定物料/仓库的现存量合计（不含 locked；TODO(口径待确认) §7-14）
    time_field: null
    time_field_type: none
    default_time_window: all
    granularity: [day]
