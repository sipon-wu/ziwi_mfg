    filters:
      - {key: chart_type, column: spc_alerts.chart_type}
      - {key: dimension_key, column: spc_alerts.dimension_key}
    sql_template: >
      SELECT {select_dims} COUNT(*) AS value, COUNT(*) AS record_count
      FROM spc_alerts
      WHERE spc_alerts.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: process_capability_cpk
    code: QC-06
