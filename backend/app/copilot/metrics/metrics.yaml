# 知微智造 · AI Copilot 指标口径字典（metrics.yaml）
# ─────────────────────────────────────────────────────────────────────────────
# 这是「指标语义层」的唯一口径来源，也是 MetricQueryService **唯一**允许执行的
# SQL 来源。所有查询均为参数化模板：
#   - 结构（SELECT/GROUP BY/WHERE）来自本文件，运行期不可被 LLM/用户改写；
#   - 列名（{select_dims}/{group_by}/{filter_clause}）只能取本文件声明的白名单列；
#   - 值（tenant_id / 时间 / 过滤值）一律通过 :param 参数化绑定。
#
# 占位符约定：
#   {select_dims}   分组维度投影（`col AS label, ...` 或空）
#   {group_by}      GROUP BY 子句（或空）
#   {time_clause}   时间过滤（`AND col BETWEEN :start AND :end` 或 `AND col <= :end` 或空）
#   {scope_clause}  数据作用域过滤（`AND col = :scope_user_id` 或空）
#   {filter_clause} 用户过滤条件（`AND col = :f0 ...` 或空）
#
# availability: available | approximate | unavailable
#   - unavailable → 查询执行器返回明确「暂不支持」话术（不报错、不编造）
#   - approximate → 可返回近似值，脚注标注「近似」
# 口径存疑项以 `TODO(口径待确认)` 标注（见 evolution-metric-dictionary §7）
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"
generated_at: "2026-10-01"

time_presets:
  all:        {label: 全部时间, mode: none}
  today:      {label: 今天, mode: between}
  yesterday:  {label: 昨天, mode: between}
  this_week:  {label: 本周, mode: between}
  last_week:  {label: 上周, mode: between}
  this_month: {label: 本月, mode: between}
  last_month: {label: 上月, mode: between}
  next7d:     {label: 未来7天, mode: lte, days: 7}
  next30d:    {label: 未来30天, mode: lte, days: 30}

metrics:
  # ══════════ 1. 生产工单域（WO）══════════
  - metric_code: work_order_count
    code: WO-01
    name: 工单总数
    domain: 工单
    formula: "COUNT(*) FROM work_orders WHERE wo_status <> 'canceled'"
    unit: 张
    source_tables: [work_orders]
    module: 生产管理(M01)
    caliber: 指定范围内生产的工单数量（默认排除 canceled；是否含 draft 见 §7-1）
    time_field: work_orders.created_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [工单总数, 工单数量, 多少张工单, 有多少工单]
    dimensions:
      - {key: workshop, column: work_orders.workshop, label: 车间}
      - {key: line_code, column: work_orders.line_code, label: 产线}
      - {key: product_code, column: work_orders.product_code, label: 产品}
      - {key: wo_status, column: work_orders.wo_status, label: 状态}
    filters:
      - {key: wo_status, column: work_orders.wo_status}
    sql_template: >
      SELECT {select_dims} COUNT(*) AS value, COUNT(*) AS record_count
      FROM work_orders
      WHERE work_orders.tenant_id = :tenant_id AND work_orders.wo_status <> 'canceled'
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: completed_work_orders
    code: WO-02
    name: 完工工单数
    domain: 工单
    formula: "COUNT(*) WHERE wo_status IN ('completed','closed')"
    unit: 张
    source_tables: [work_orders]
    module: 生产管理(M01)
    caliber: 状态为已完工/关闭的工单数（completed 与 closed 并计）
    time_field: work_orders.created_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [完工工单, 完工了多少, 完工数量]
    dimensions:
      - {key: workshop, column: work_orders.workshop, label: 车间}
      - {key: line_code, column: work_orders.line_code, label: 产线}
    filters:
      - {key: product_code, column: work_orders.product_code}
    sql_template: >
      SELECT {select_dims} COUNT(*) AS value, COUNT(*) AS record_count
      FROM work_orders
      WHERE work_orders.tenant_id = :tenant_id AND work_orders.wo_status IN ('completed','closed')
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: wip_work_orders
    code: WO-03
    name: 在制工单数
    domain: 工单
    formula: "COUNT(*) WHERE wo_status IN ('released','in_progress')"
    unit: 张
    source_tables: [work_orders]
    module: 生产管理(M01)
    caliber: 当前处于执行中的工单数（released + in_progress；TODO(口径待确认) §7-2）
    time_field: work_orders.created_at
    time_field_type: datetime
    default_time_window: all
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [在制工单, 在制, 在制数量, 进行中工单]
    dimensions:
      - {key: workshop, column: work_orders.workshop, label: 车间}
      - {key: line_code, column: work_orders.line_code, label: 产线}
      - {key: product_code, column: work_orders.product_code, label: 产品}
    filters:
      - {key: line_code, column: work_orders.line_code}
    sql_template: >
      SELECT {select_dims} COUNT(*) AS value, COUNT(*) AS record_count
      FROM work_orders
      WHERE work_orders.tenant_id = :tenant_id AND work_orders.wo_status IN ('released','in_progress')
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: on_time_delivery_rate
    code: WO-04
    name: 工单按期交付率
    domain: 工单
    formula: "COUNT(actual_end_at <= scheduled_end_at) / COUNT(完工工单)"
    unit: "%"
    source_tables: [work_orders]
    module: 生产管理(M01)
    caliber: 按期完工工单占已完工工单的比例（actual_end_at <= scheduled_end_at；TODO(口径待确认) §7-3）
    time_field: work_orders.actual_end_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [按期交付率, 准时交付率, 交付率]
    dimensions:
      - {key: workshop, column: work_orders.workshop, label: 车间}
      - {key: line_code, column: work_orders.line_code, label: 产线}
    filters:
      - {key: line_code, column: work_orders.line_code}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN COUNT(*) > 0
             THEN SUM(CASE WHEN work_orders.actual_end_at <= work_orders.scheduled_end_at THEN 1 ELSE 0 END) * 1.0 / COUNT(*)
             ELSE NULL END AS value,
        COUNT(*) AS record_count
      FROM work_orders
      WHERE work_orders.tenant_id = :tenant_id
        AND work_orders.wo_status IN ('completed','closed')
        AND work_orders.actual_end_at IS NOT NULL
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: work_order_completion_rate
    code: WO-05
    name: 工单计划完成率
    domain: 工单
    formula: "SUM(completed_qty) / SUM(planned_qty)"
    unit: "%"
    source_tables: [work_orders]
    module: 生产管理(M01)
    caliber: 已完成数量占计划数量的比例（分母为 0 返回无数据）
    time_field: work_orders.created_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [计划完成率, 工单进度, 完成率, 工单完成率]
    dimensions:
      - {key: workshop, column: work_orders.workshop, label: 车间}
      - {key: line_code, column: work_orders.line_code, label: 产线}
      - {key: product_code, column: work_orders.product_code, label: 产品}
    filters:
      - {key: line_code, column: work_orders.line_code}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN SUM(work_orders.planned_qty) > 0
             THEN SUM(work_orders.completed_qty) * 1.0 / SUM(work_orders.planned_qty)
             ELSE NULL END AS value,
        SUM(work_orders.completed_qty) AS completed_qty,
        SUM(work_orders.planned_qty) AS planned_qty,
        COUNT(*) AS record_count
      FROM work_orders
      WHERE work_orders.tenant_id = :tenant_id AND work_orders.wo_status <> 'canceled'
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: work_order_scrap_qty
    code: WO-06
    name: 工单报废数
    domain: 工单
    formula: "SUM(scrap_qty)"
    unit: 件
    source_tables: [work_orders]
    module: 生产管理(M01)
    caliber: 工单层面记录的报废数量（与报工域 WR-03 存在双口径，TODO(口径待确认) §7-4）
    time_field: work_orders.created_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [工单报废, 报废数, 工单报废数]
    dimensions:
      - {key: workshop, column: work_orders.workshop, label: 车间}
      - {key: line_code, column: work_orders.line_code, label: 产线}
      - {key: product_code, column: work_orders.product_code, label: 产品}
    filters:
      - {key: line_code, column: work_orders.line_code}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(work_orders.scrap_qty), 0) AS value, COUNT(*) AS record_count
      FROM work_orders
      WHERE work_orders.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  # ══════════ 2. 报工域（WR）══════════
  - metric_code: output_qty
    code: WR-01
    name: 产量
    domain: 报工
    formula: "SUM(output_qty)"
    unit: 件
    source_tables: [work_reports, work_orders]
    module: 生产管理(M01)
    caliber: 指定范围报工产出数量合计（是否含不良见 §7-5）
    time_field: wr.report_date
    time_field_type: date
    default_time_window: yesterday
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [产量, 产出, 产出数量, 生产数量, 报工产量]
    dimensions:
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: workshop, column: wo.workshop, label: 车间}
      - {key: product_code, column: wo.product_code, label: 产品}
      - {key: operation_code, column: wr.operation_code, label: 工序}
    filters:
      - {key: line_code, column: wo.line_code}
      - {key: product_code, column: wo.product_code}
      - {key: status, column: wr.status}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(wr.output_qty), 0) AS value, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: good_qty
    code: WR-02
    name: 良品数
    domain: 报工
    formula: "SUM(output_qty) - SUM(scrap_qty)"
    unit: 件
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 产出中合格的数量（暂定口径，依赖 §7-5）
    time_field: wr.report_date
    time_field_type: date
    default_time_window: yesterday
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [良品数, 合格数量, 良品]
    dimensions:
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: product_code, column: wo.product_code, label: 产品}
    filters:
      - {key: line_code, column: wo.line_code}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(wr.output_qty) - SUM(wr.scrap_qty), 0) AS value, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: scrap_qty
    code: WR-03
    name: 不良数
    domain: 报工
    formula: "SUM(scrap_qty)"
    unit: 件
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 报工记录的不良/报废数量合计（与 WO-06 可能不一致，TODO(口径待确认) §7-4）
    time_field: wr.report_date
    time_field_type: date
    default_time_window: last_week
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [不良数, 不良数量, 报废数, 不良品]
    dimensions:
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: operation_code, column: wr.operation_code, label: 工序}
      - {key: defect_reason, column: wr.defect_reason, label: 不良原因}
    filters:
      - {key: line_code, column: wo.line_code}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(wr.scrap_qty), 0) AS value, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: yield_rate
    code: WR-04
    name: 良率
    domain: 报工
    formula: "(SUM(output_qty)-SUM(scrap_qty)) / SUM(output_qty)"
    unit: "%"
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 良品数占产出数量的比例（分母=产出、分子=良品；分母 0 返回无数据；TODO(口径待确认) §7-5/§7-6）
    time_field: wr.report_date
    time_field_type: date
    default_time_window: yesterday
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [良率, 合格率, 良品率, 一次合格率, 良率趋势]
    dimensions:
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: workshop, column: wo.workshop, label: 车间}
      - {key: product_code, column: wo.product_code, label: 产品}
    filters:
      - {key: line_code, column: wo.line_code}
      - {key: product_code, column: wo.product_code}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN SUM(wr.output_qty) > 0
             THEN (SUM(wr.output_qty) - SUM(wr.scrap_qty)) * 1.0 / SUM(wr.output_qty)
             ELSE NULL END AS value,
        SUM(wr.output_qty) AS output_qty, SUM(wr.scrap_qty) AS scrap_qty, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: defect_rate
    code: WR-05
    name: 不良率
    domain: 报工
    formula: "SUM(scrap_qty) / SUM(output_qty)"
    unit: "%"
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 不良数占产出数量的比例（= 1 - 良率；TODO(口径待确认) §7-6）
    time_field: wr.report_date
    time_field_type: date
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: bar
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [不良率, 不合格率, 不良率排名]
    dimensions:
      - {key: workshop, column: wo.workshop, label: 车间}
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: product_code, column: wo.product_code, label: 产品}
    filters:
      - {key: workshop, column: wo.workshop}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN SUM(wr.output_qty) > 0
             THEN SUM(wr.scrap_qty) * 1.0 / SUM(wr.output_qty)
             ELSE NULL END AS value,
        COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: labor_hours
    code: WR-06
    name: 人工工时
    domain: 报工
    formula: "SUM(labor_hours)"
    unit: 小时
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 报工的人工工时合计
    time_field: wr.report_date
    time_field_type: date
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [人工工时, 工时, 人时]
    dimensions:
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: operation_code, column: wr.operation_code, label: 工序}
    filters:
      - {key: line_code, column: wo.line_code}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(wr.labor_hours), 0) AS value, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: machine_hours
    code: WR-07
    name: 设备工时
    domain: 报工
    formula: "SUM(machine_hours)"
    unit: 小时
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 报工记录的设备工时合计
    time_field: wr.report_date
    time_field_type: date
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    aliases: [设备工时, 机时, 机器工时]
    dimensions:
      - {key: line_code, column: wo.line_code, label: 产线}
      - {key: operation_code, column: wr.operation_code, label: 工序}
    filters:
      - {key: line_code, column: wo.line_code}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(wr.machine_hours), 0) AS value, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  # ══════════ 3. 品质 / SPC 域（QC）══════════
  - metric_code: inspection_pass_rate
    code: QC-01
    name: 检验合格率
    domain: 品质
    formula: "COUNT(result='ACC') / COUNT(result IN ('ACC','REJ'))"
    unit: "%"
    source_tables: [inspection_order]
    module: 品质管理(M03)
    caliber: 判定合格的检验单占已判定检验单的比例（按单，UAI 暂不计入分母；TODO(口径待确认) §7-8）
    time_field: inspection_order.judge_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [检验合格率, 一次交验合格率, 合格率, 交验合格率]
    dimensions:
      - {key: order_type, column: inspection_order.order_type, label: 检验类型}
      - {key: product_code, column: inspection_order.material_id, label: 物料}
    filters:
      - {key: order_type, column: inspection_order.order_type}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN SUM(CASE WHEN inspection_order.result IN ('ACC','REJ') THEN 1 ELSE 0 END) > 0
             THEN SUM(CASE WHEN inspection_order.result = 'ACC' THEN 1 ELSE 0 END) * 1.0
                  / SUM(CASE WHEN inspection_order.result IN ('ACC','REJ') THEN 1 ELSE 0 END)
             ELSE NULL END AS value,
        COUNT(*) AS record_count
      FROM inspection_order
      WHERE inspection_order.tenant_id = :tenant_id
        AND inspection_order.result IN ('ACC','REJ','UAI')
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: inspection_order_count
    code: QC-02
    name: 检验单数
    domain: 品质
    formula: "COUNT(*)"
    unit: 张
    source_tables: [inspection_order]
    module: 品质管理(M03)
    caliber: 检验单总量（含未判定；待检数 = result IS NULL）
    time_field: inspection_order.created_at
    time_field_type: datetime
    default_time_window: today
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [检验单, 检验单数, 待检数, 待判定, 检验数量]
    dimensions:
      - {key: order_type, column: inspection_order.order_type, label: 检验类型}
      - {key: result, column: inspection_order.result, label: 结果}
    filters:
      - {key: order_type, column: inspection_order.order_type}
      - {key: result, column: inspection_order.result}
    sql_template: >
      SELECT {select_dims} COUNT(*) AS value, COUNT(*) AS record_count
      FROM inspection_order
      WHERE inspection_order.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: inspection_item_fail_rate
    code: QC-03
    name: 检验项不合格率
    domain: 品质
    formula: "COUNT(result='FAIL') / COUNT(*)"
    unit: "%"
    source_tables: [inspection_result]
    module: 品质管理(M03)
    caliber: 检验明细项判定 FAIL 的比例（与 QC-01 口径不同：项 vs 单；TODO(口径待确认) §7-8）
    time_field: inspection_result.created_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [检验项不合格率, 项不合格率, 不合格项]
    dimensions:
      - {key: item_name, column: inspection_result.item_name, label: 检验项}
    filters:
      - {key: result, column: inspection_result.result}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN COUNT(*) > 0 THEN SUM(CASE WHEN inspection_result.result = 'FAIL' THEN 1 ELSE 0 END) * 1.0 / COUNT(*) ELSE NULL END AS value,
        COUNT(*) AS record_count
      FROM inspection_result
      WHERE inspection_result.tenant_id = :tenant_id
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: defect_top
    code: QC-04
    name: 不良TOP
    domain: 品质
    formula: "GROUP BY defect_reason ORDER BY SUM(scrap_qty) DESC"
    unit: 件
    source_tables: [work_reports]
    module: 生产管理(M01)
    caliber: 按不良原因统计的 TOP N 与占比（依赖 defect_reason 填写完整度；TODO(口径待确认) §7-9）
    time_field: wr.report_date
    time_field_type: date
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: bar
    sensitivity: normal
    availability: available
    scope_field: wr.reporter_id
    default_dimensions: [defect_reason]
    aliases: [不良TOP, 不良TOP3, 不良排名, 不良原因, 主要不良]
    dimensions:
      - {key: defect_reason, column: wr.defect_reason, label: 不良原因}
      - {key: line_code, column: wo.line_code, label: 产线}
    filters:
      - {key: line_code, column: wo.line_code}
    sql_template: >
      SELECT {select_dims} COALESCE(SUM(wr.scrap_qty), 0) AS value, COUNT(*) AS record_count
      FROM work_reports wr
      LEFT JOIN work_orders wo ON wo.id = wr.work_order_id
      WHERE wr.tenant_id = :tenant_id AND wr.scrap_qty > 0
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

  - metric_code: spc_alert_count
    code: QC-05
    name: SPC 异常/告警数
    domain: 品质
    formula: "COUNT(*) FROM spc_alerts"
    unit: 条
