    name: 维保执行率
    domain: 设备
    formula: "COUNT(status='completed') / COUNT(*)"
    unit: "%"
    source_tables: [maintenance_tasks]
    module: 设备管理(TPM)
    caliber: 已完成的维保任务占应执行任务的比例（TODO(口径待确认) §7-12）
    time_field: maintenance_tasks.created_at
    time_field_type: datetime
    default_time_window: this_month
    granularity: [day, week, month]
    viz_hint: metric
    sensitivity: normal
    availability: available
