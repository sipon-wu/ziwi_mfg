    aliases: [库存, 库存量, 现存量, 有多少库存]
    dimensions:
      - {key: material_id, column: inventory.material_id, label: 物料}
      - {key: warehouse_id, column: inventory.warehouse_id, label: 仓库}
    filters:
      - {key: material_id, column: inventory.material_id}
