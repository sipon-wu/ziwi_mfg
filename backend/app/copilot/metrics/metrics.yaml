    dimensions:
      - {key: task_type, column: maintenance_tasks.task_type, label: 类型}
    filters:
      - {key: task_type, column: maintenance_tasks.task_type}
    sql_template: >
      SELECT {select_dims}
        CASE WHEN COUNT(*) > 0 THEN SUM(CASE WHEN maintenance_tasks.status = 'completed' THEN 1 ELSE 0 END) * 1.0 / COUNT(*) ELSE NULL END AS value,
