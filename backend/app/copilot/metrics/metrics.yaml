  - metric_code: inventory_alert_count
    code: WM-02
    name: 库存预警
    domain: 仓储
    formula: "COUNT(inventory.quantity < materials.min_stock_qty)"
    unit: 项
    source_tables: [inventory, materials]
    module: 仓储管理(M20)
    caliber: 低于最低库存的物料数（阈值用 min_stock；TODO(口径待确认) §7-14）
    time_field: null
    time_field_type: none
    default_time_window: all
    granularity: [day]
    viz_hint: metric
    sensitivity: normal
    availability: available
    aliases: [库存不足, 库存预警, 缺料, 低于安全库存, 物料库存不足]
    dimensions:
      - {key: material_id, column: inventory.material_id, label: 物料}
    filters:
      - {key: material_id, column: inventory.material_id}
    sql_template: >
      SELECT {select_dims} COUNT(*) AS value, COUNT(*) AS record_count
      FROM inventory
      JOIN materials m ON m.id = inventory.material_id
      WHERE inventory.tenant_id = :tenant_id AND inventory.quantity < m.min_stock_qty
      {time_clause} {scope_clause} {filter_clause}
      {group_by}

