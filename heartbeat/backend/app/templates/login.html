<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 知微心跳监控平台</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600 shadow-xl shadow-brand-900/50 text-white text-3xl font-bold mb-4">Z</div>
      <h1 class="text-2xl font-semibold text-white">知微心跳监控平台</h1>
      <p class="text-slate-400 text-sm mt-1">Ziwi License 授权与心跳中枢</p>
    </div>
    <div class="bg-white rounded-2xl shadow-2xl p-7">
      {% if locked %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
        登录尝试过于频繁，账户已锁定 {{ lockout_minutes }} 分钟，请稍后再试。
      </div>
      {% endif %}
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
        用户名或密码错误，请重试。
      </div>
      {% endif %}
      <form method="post" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
          <input type="text" name="username" autofocus required
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
          <input type="password" name="password" required
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm">
        </div>
        <button type="submit"
                class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm transition shadow-sm">
          登录
        </button>
      </form>
    </div>
    <p class="text-center text-slate-500 text-xs mt-6">内部系统 · 仅授权人员可访问</p>
  </div>
</body>
</html>
